name: luadtx

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: luadtx
      # Falls back to a fixed dev password when no .env is present (local
      # dev); on AWS this is overridden by an .env file the CloudFormation
      # UserData script writes from Secrets Manager -- see infra/cloudformation.yaml.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luadtx_dev}
      POSTGRES_DB: luadtx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      # Service name "postgres" is the hostname on Docker's internal network
      # -- not localhost, which only ever refers to backend's own container.
      DATABASE_URL: postgresql://luadtx:${POSTGRES_PASSWORD:-luadtx_dev}@postgres:5432/luadtx
    # No host port publish -- nginx is the only public entry point now,
    # reaching this over the internal docker network by service name.
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Service name "backend" is the hostname on Docker's internal network
      # -- reaches the backend container directly, no public round-trip.
      API_URL: http://backend:8000
    # No host port publish -- see backend's note above.
    depends_on:
      - backend

  # Reverse proxy + TLS termination -- the only service with published
  # ports. Fronts frontend (Streamlit UI) and backend (/api/) behind
  # https://luadtx.stoichioomics.com. See nginx/conf.d/luadtx.conf.
  # Self-reloads every 12h so a cert renewed by the certbot loop below
  # gets picked up without any host-level cron (nothing to install on
  # Amazon Linux 2023, which has no cron package by default).
  nginx:
    image: nginx:1.27-alpine
    entrypoint: >-
      /bin/sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  # Long-running renewal loop, started automatically by `docker compose
  # up`. `certbot renew` is a no-op until ~30 days before expiry, so this
  # just polls harmlessly the rest of the time. For the one-time initial
  # issuance (no cert to renew yet), invoke certonly directly with
  # `docker compose run --rm --entrypoint certbot certbot certonly ...`
  # -- --entrypoint overrides the loop below back to the real certbot
  # binary for that one command.
  certbot:
    image: certbot/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot -q; sleep 12h & wait $${!}; done;"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:

